<!doctype html>
<html lang="zh-CN" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/logo.svg" />
    <meta name="description" content="回路工坊 CircuitCraft — 闯关式 PCB 电路设计模拟学习游戏。从点亮一颗 LED，到打出你的第一块 PCB。" />
    <meta property="og:title" content="回路工坊 CircuitCraft" />
    <meta property="og:description" content="从点亮一颗 LED，到打出你的第一块 PCB。" />
    <meta property="og:image" content="/og-cover.png" />
    <title>回路工坊 CircuitCraft — PCB 电路学习闯关</title>
    <script>
      // 防首帧闪暗：React 挂载前从进度存档读主题，亮色用户直接以 data-theme="light" 起绘
      try {
        var saved = JSON.parse(localStorage.getItem('cc-save-v1') || 'null');
        if (saved && saved.state && saved.state.settings && saved.state.settings.theme === 'light') {
          document.documentElement.dataset.theme = 'light';
        }
      } catch (e) { /* 存档损坏则保持默认暗色 */ }
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Noto+Sans+SC:wght@400;500;700;900&family=Orbitron:wght@600;800&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
