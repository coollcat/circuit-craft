<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <!-- 回路工坊 CircuitCraft logo: PCB via + 45° trace + square pad -->
  <rect width="120" height="120" rx="18" fill="#0A100D"/>
  <!-- trace: 45° polyline from via center to corner pad -->
  <path d="M46 74 L74 46 L74 30 L96 30" fill="none" stroke="#2E9E63" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M46 74 L74 46 L74 30 L96 30" fill="none" stroke="#3FC47F" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.8"/>
  <!-- square pad at trace end -->
  <rect x="88" y="22" width="16" height="16" rx="3" fill="#C9803C"/>
  <rect x="91.5" y="25.5" width="9" height="9" rx="1.5" fill="#0A100D"/>
  <!-- via: copper annular ring + hole -->
  <circle cx="46" cy="74" r="26" fill="#C9803C"/>
  <circle cx="46" cy="74" r="26" fill="none" stroke="#E0A458" stroke-width="2"/>
  <circle cx="46" cy="74" r="12" fill="#060A08"/>
  <circle cx="46" cy="74" r="12" fill="none" stroke="#9A5E28" stroke-width="2"/>
</svg>
